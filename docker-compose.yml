
services:
  # Banco de dados PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: kanban-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Defina POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-kanban_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # API Java / Spring Boot
  api:
    build: ./backend
    container_name: kanban-api
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-kanban_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-kanban_app}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}

  # Front-end React / Nginx
  frontend:
    build: ./frontend
    container_name: kanban-frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
