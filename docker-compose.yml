services:
  # Banco de dados PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: kanban-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "0411"
      POSTGRES_DB: kanban_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # API em Java / Spring Boot
  api:
    build: ./backend
    container_name: kanban-api
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/kanban_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "0411"

  # Front-end React
  frontend:
    build: ./frontend
    container_name: kanban-frontend
    ports:
      - "5173:80"
    depends_on:
      - api

# Declaração do volume no final do arquivo
volumes:
  postgres_data: