spring.application.name=api

# Conexao com PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kanban_db}
spring.datasource.username=${DB_USER:kanban_app}
spring.datasource.password=${DB_PASSWORD}

# Configuracoes JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# FLYWAY - MIGRACOES DO BANCO DE DADOS

# Habilita o gerenciamento de migracoes
spring.flyway.enabled=true

# Impede o baseline automatico em bancos existentes desconhecidos
spring.flyway.baseline-on-migrate=false

# Considera a estrutura atual como versao 1
spring.flyway.baseline-version=1

# Pasta onde ficarao os scripts SQL
spring.flyway.locations=classpath:db/migration
